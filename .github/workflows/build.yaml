name: Build

on:
  push:
    branches:
      - master
      - 'release/v*'
      - 'release/**/v*'
    tags:
      - 'v*'
    paths:
      - '**'
      - '!**/*.md'
      - '!tests/**'
      - '!.github/**'
      - .github/workflows/build.yaml
      - .github/workflows/lint.yaml
  pull_request:
    branches:
      - master
    paths:
      - '**'
      - '!**/*.md'
      - '!tests/**'
      - '!.github/**'
      - .github/workflows/build.yaml
      - .github/workflows/lint.yaml
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TEST_TAG: ${{ github.repository }}:${{github.run_id}}
  PUBLISH: >-
    ${{ github.event_name == 'push' &&
    (github.ref == 'refs/heads/master' ||
    startsWith(github.ref, 'refs/heads/release/') ||
    startsWith(github.ref, 'refs/tags/v')) }}

jobs:
  lint:
    permissions:
      contents: read
    uses: ./.github/workflows/lint.yaml

  build-and-push-image:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - container: Containerfile.debian
            autotag: false
            suffix: -debian
          - container: Containerfile.alpine
            autotag: auto

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          lfs: true

      - name: Version
        run: echo "VERSION=$(pipx run setuptools-scm)" >> "${GITHUB_ENV}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Container registry
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=edge
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: |
            latest=${{ matrix.autotag }}
            suffix=${{ matrix.suffix }}

      - name: Build and export
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.container }}
          load: true
          tags: ${{ env.TEST_TAG }}
          build-args: |
            VERSION=${{ env.VERSION }}

      - name: Test
        run: >
          docker container run \
            --rm \
            --volume "$(pwd)/test:/usr/local/src/semonitor/test" \
            ${{ env.TEST_TAG }} \
            './test/test.sh'

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          platforms: linux/amd64,linux/386,linux/arm64,linux/arm/v7,linux/arm/v6
          context: .
          file: ${{ matrix.container }}
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
