name: Lint

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Run pre-commit
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade --requirement requirements-dev.txt
          .venv/bin/pre-commit run --all-files --show-diff-on-failure --color=always
