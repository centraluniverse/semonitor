name: Lint

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_call:

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: pyproject.toml

      - name: Run pre-commit
        run: ./pre-commit.sh --all-files --show-diff-on-failure --color=always

  ruff:
    name: ruff format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Ruff format
        uses: astral-sh/ruff-action@v3
        with:
          args: format --check --diff
